<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Keduki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header, age-bubble navigator as the hero, product grid, slide-in panels for cart/detail, a separate admin view. */
:root{
  --bg:#FAF9FF; --surface:#FFFFFF; --ink:#27234D; --muted:#6B6790; --line:#E8E5F6;
  --accent:#FFC93C; --accent-ink:#27234D; --danger:#D13A57; --ok:#14805F;
  --shape:rgba(255,255,255,.55); --glfill:rgba(255,255,255,.65);
  --t0:#FFD6E1; --t1:#FFE7A8; --t2:#BFEBD9; --t3:#C4DFFF; --t4:#DCCFFF; --t5:#FFD3B5;
  --shadow:0 1px 2px rgba(39,35,77,.06),0 10px 28px rgba(39,35,77,.07);
  --f-display:'Baloo Da 2','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15132B; --surface:#1E1B3B; --ink:#F3F1FF; --muted:#ADA9D3; --line:#332F5F;
  --danger:#FF7A90; --ok:#55D6A8; --shape:rgba(255,255,255,.1); --glfill:rgba(255,255,255,.12);
  --t0:#5A3150; --t1:#5A4B22; --t2:#26513F; --t3:#273F66; --t4:#41336A; --t5:#5C3A28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15132B; --surface:#1E1B3B; --ink:#F3F1FF; --muted:#ADA9D3; --line:#332F5F;
  --danger:#FF7A90; --ok:#55D6A8; --shape:rgba(255,255,255,.1); --glfill:rgba(255,255,255,.12);
  --t0:#5A3150; --t1:#5A4B22; --t2:#26513F; --t3:#273F66; --t4:#41336A; --t5:#5C3A28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);margin:0;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* header */
.ann{background:var(--ink);color:var(--bg);text-align:center;font-size:13px;padding:7px 12px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:800 28px/1 var(--f-display);letter-spacing:-.5px;color:var(--ink)}
.logo svg{width:34px;height:34px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.pill:hover{border-color:var(--ink)}
.cartbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cartbtn b{background:var(--accent-ink);color:var(--accent);min-width:22px;height:22px;border-radius:11px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}

/* hero + ages */
.hero{display:grid;gap:8px;padding:28px 0 18px;position:relative}
.hero small{font-weight:600;color:var(--muted);letter-spacing:.02em}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;max-width:16ch}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 12px}
.sec-h h2{font-size:22px}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:4px 0}
.ages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.ages{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.ages{grid-template-columns:repeat(6,minmax(0,1fr))}}
.age{position:relative;overflow:hidden;text-align:left;background:var(--c);color:var(--ink);border:0;border-radius:26px;padding:16px 14px;min-height:124px;display:flex;flex-direction:column;gap:0;outline:3px solid transparent;outline-offset:2px;transition:transform .15s,outline-color .15s}
.age:hover{transform:translateY(-3px)}
.age.on{outline-color:var(--ink)}
.age b{font:800 32px/1.1 var(--f-display)}
.age small{font-size:12px;opacity:.8}
.age span{font-size:13px;font-weight:600;margin-top:auto;line-height:1.3}
.age .shape{position:absolute;right:-16px;top:-16px;width:68px;height:68px;background:var(--shape)}
.s0{border-radius:50%}.s1{border-radius:22px;transform:rotate(18deg)}.s2{border-radius:50% 50% 0 0}.s3{border-radius:34px 34px 34px 6px}.s4{border-radius:62% 38% 55% 45%}.s5{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* filters */
.bar{display:grid;gap:10px;margin:26px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.tools input{flex:1 1 220px;width:auto}
.tools select{flex:0 1 190px;width:auto}
.count{color:var(--muted);font-size:14px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;display:block;width:100%;aspect-ratio:1;background:var(--c);border:0;padding:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg.gl{width:56%;height:56%;position:absolute;inset:0;margin:auto;color:var(--ink)}
.tag{position:absolute;left:10px;top:10px;font-style:normal;font-weight:700;font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
.tag.out{top:auto;bottom:10px;background:var(--ink);color:var(--bg)}
.ph.dim img,.ph.dim svg.gl{opacity:.45}
.ci{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{background:none;border:0;padding:0;text-align:left;font-weight:600;line-height:1.35;color:var(--ink)}
.nm:hover{text-decoration:underline}
.sub{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rt{color:var(--ink);font-weight:600}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:2px}
.pr b{font:800 20px/1 var(--f-display)}
.pr s{color:var(--muted);font-size:13px}
.buy{margin-top:4px}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:700;border-radius:14px;padding:10px 16px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.add,.btn.prime{background:var(--accent);color:var(--accent-ink);width:100%}
.btn.prime{min-height:48px;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:disabled{color:var(--muted)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px;border-radius:11px}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:hover:not(:disabled){filter:brightness(.96)}
.step{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;min-height:42px;overflow:hidden}
.step button{background:none;border:0;font:700 22px/1 var(--f-body);height:42px;color:var(--accent-ink)}
.step output{text-align:center;font-weight:700}
.empty{grid-column:1/-1;text-align:center;border:2px dashed var(--line);border-radius:24px;padding:42px 18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:4px}

/* QnA */
.qa{display:grid;gap:22px;margin-top:56px}
@media(min-width:860px){.qa{grid-template-columns:1.3fr 1fr;align-items:start}}
.deliv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 16px}
.deliv div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.deliv small{display:block;color:var(--muted);font-size:12.5px}
.deliv b{font:800 21px/1.2 var(--f-display)}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600;padding:13px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:700 20px/1 var(--f-body);color:var(--muted)}
details[open] summary::after{content:"−"}
details p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:12px}
.box h3{font-size:19px}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0;font-weight:600}

footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;color:var(--muted);font-size:14px}
footer b{font:800 20px var(--f-display);color:var(--ink)}

/* panels */
#ov{position:fixed;inset:0;background:rgba(18,16,40,.55);z-index:40}
.panel{position:fixed;z-index:41;background:var(--surface);color:var(--ink);overflow:auto;left:0;right:0;bottom:0;max-height:92dvh;border-radius:28px 28px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media(min-width:760px){
  .panel.cart,.panel.checkout,.panel.done{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:28px 0 0 28px}
  .panel.detail,.panel.edit{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(880px,92vw);max-height:90dvh;border-radius:28px}
}
.ph-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ph-h h2{font-size:24px}
.x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:20px;line-height:1;flex:none}
.lines{display:grid;gap:12px;margin-bottom:16px}
.ln{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.ln .th{width:64px;height:64px;border-radius:16px;background:var(--c);overflow:hidden;position:relative}
.ln .th img{width:100%;height:100%;object-fit:cover}
.ln .th svg.gl{width:60%;height:60%;position:absolute;inset:0;margin:auto;color:var(--ink)}
.ln .in{min-width:0;display:grid;gap:4px}
.ln .in b{font-weight:600;line-height:1.3}
.ln .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ln .step{width:118px;min-height:34px}
.ln .step button{height:34px}
.rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.sum{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font:800 22px var(--f-display);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio label{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600;grid-template-columns:auto 1fr;align-items:center;gap:8px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--ink);padding:0}
.radio label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.cod{display:flex;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--ink);border-radius:14px;padding:11px 14px;font-weight:600}
.done{text-align:center}
.done .big{width:84px;height:84px;border-radius:50%;background:var(--t2);display:grid;place-items:center;margin:8px auto 14px}

/* detail */
.dt{display:grid;gap:20px}
@media(min-width:760px){.dt{grid-template-columns:1fr 1fr}}
.dt .big{aspect-ratio:1;border-radius:24px;background:var(--c);position:relative;overflow:hidden}
.dt .big img{width:100%;height:100%;object-fit:cover}
.dt .big svg.gl{width:52%;height:52%;position:absolute;inset:0;margin:auto;color:var(--ink)}
.dt .info{display:grid;gap:10px;align-content:start}
.dt h2{font-size:28px}
.dt .pr b{font-size:30px}
.agechips{display:flex;gap:6px;flex-wrap:wrap}
.agechips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.desc{color:var(--muted);white-space:pre-line;margin:0}
.rv{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:14px}
@media(min-width:760px){.rv{grid-template-columns:1fr 1fr;align-items:start}}
.rvi{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg)}
.rvi header{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.stars{color:#E0A100;letter-spacing:2px}
.rvi p{margin:4px 0 0;color:var(--muted)}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:28px;line-height:1;color:var(--line);padding:2px}
.starpick button.on{color:#E0A100}

/* admin */
.adm{padding-top:22px}
.adm-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.adm-h h1{font-size:28px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.tabs .chip b{margin-left:6px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-size:12px}
.ad-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ad-bar h2{font-size:20px}
.rows{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.row2 .th{width:56px;height:56px;border-radius:14px;background:var(--c);overflow:hidden;position:relative}
.row2 .th img{width:100%;height:100%;object-fit:cover}
.row2 .th svg.gl{width:60%;height:60%;position:absolute;inset:0;margin:auto;color:var(--ink)}
.row2 .mid{min-width:0}
.row2 .mid b{display:block;font-weight:600;line-height:1.3}
.row2 .mid small{color:var(--muted)}
.row2 .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:8px}
.oc header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.oc header b{font:800 18px var(--f-display)}
.oc select{width:auto;padding:6px 10px;border-radius:10px}
.oc ul{margin:0;padding-left:18px;color:var(--muted)}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:8px}
.qc .acts{display:flex;gap:8px;flex-wrap:wrap}
.pend{font-size:12px;font-weight:700;background:var(--t1);border-radius:999px;padding:1px 9px;justify-self:start}
.grid2{display:grid;gap:12px}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.agepick{display:flex;flex-wrap:wrap;gap:8px}
.agepick label{display:flex;grid-template-columns:none;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.agepick label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agepick input{width:auto;accent-color:var(--accent);padding:0}
.drop{display:grid;place-items:center;gap:6px;text-align:center;min-height:180px;border:2px dashed var(--line);border-radius:20px;background:var(--bg);position:relative;overflow:hidden;cursor:pointer;color:var(--muted);padding:12px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.banner{background:var(--t1);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ===== playful layer: background, hero, motion ===== */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
   radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.6px,transparent 1.8px) 0 0/30px 30px,
   linear-gradient(180deg,var(--bg),var(--bg))}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.75;will-change:transform}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--t0);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-14vmax;top:22vh;background:var(--t3);animation:drift2 26s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;left:20vw;bottom:-18vmax;background:var(--t1);animation:drift3 24s ease-in-out infinite alternate}
.fx{position:absolute;display:block;opacity:.5;animation:floaty var(--dur) ease-in-out var(--dl) infinite alternate;will-change:transform}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fx{opacity:.3}:root:not([data-theme="light"]) .blob{opacity:.55}}
:root[data-theme="dark"] .fx{opacity:.3}:root[data-theme="dark"] .blob{opacity:.55}
@media(max-width:620px){.fx:nth-child(n+11){display:none}}
#app{position:relative;z-index:1}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vw,-14vh) scale(1.1)}}
@keyframes drift3{to{transform:translate(-14vw,-8vh) scale(1.18)}}
@keyframes floaty{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(14px,-30px) rotate(var(--rot))}}

.ann{background:linear-gradient(90deg,#B79CFF,#FF8FB1,#FFC93C,#6FD6B4,#8EB8FF,#B79CFF);background-size:300% 100%;color:#27234D;font-weight:700;animation:shimmer 14s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.hdr{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo svg{transition:transform .3s}
.logo:hover svg{animation:wiggle .6s}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.08)}50%{transform:rotate(12deg) scale(1.08)}80%{transform:rotate(-6deg)}}

.hero{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:22px;
  margin-top:18px;padding:34px 28px;border-radius:36px;
  background:linear-gradient(120deg,var(--t1),var(--t0) 45%,var(--t4) 100%);background-size:200% 200%;animation:heroShift 14s ease-in-out infinite alternate;
  box-shadow:var(--shadow)}
@keyframes heroShift{to{background-position:100% 100%}}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--shape);pointer-events:none}
.hero::before{width:190px;height:190px;right:-50px;top:-70px;animation:floaty 9s ease-in-out infinite alternate;--rot:20deg}
.hero::after{width:120px;height:120px;left:38%;bottom:-50px;animation:floaty 11s ease-in-out -4s infinite alternate;--rot:-20deg}
.hero>*{position:relative;z-index:1}
.hero .txt{flex:1 1 320px;display:grid;gap:8px;justify-items:start}
.hero small{color:var(--ink);opacity:.75;animation:rise .6s .05s backwards}
.hero h1{animation:rise .7s .15s backwards}
.hero p{color:var(--ink);opacity:.8;animation:rise .7s .3s backwards}
.hero .cta{margin-top:8px;padding-inline:22px;min-height:48px;font-size:16px;animation:rise .7s .45s backwards}
.hero .cta span{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hl{padding:0 6px;border-radius:6px;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--accent) 55%,transparent) 58%) no-repeat 0 0/0% 100%;animation:hl .9s .7s ease-out forwards}
@keyframes hl{to{background-size:100% 100%}}
.blocks{display:flex;align-items:flex-end;gap:12px;padding:0 10px 12px 0}
.blk{display:grid;place-items:center;width:72px;height:72px;border-radius:20px;font:800 38px/1 var(--f-display);font-style:normal;color:#27234D;
  box-shadow:0 8px 0 rgba(39,35,77,.2);animation:bounce 2.2s ease-in-out infinite}
.k1{background:#FF8FB1;--r:-8deg}.k2{background:#FFC93C;width:88px;height:88px;font-size:46px;--r:6deg;animation-delay:.25s}.k3{background:#6FD6B4;--r:-5deg;animation-delay:.5s}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-20px) rotate(calc(var(--r)*-1))}}
@media(max-width:520px){.hero{padding:26px 20px;border-radius:28px}.blk{width:58px;height:58px;font-size:30px;border-radius:16px}.k2{width:68px;height:68px;font-size:36px}}

.sec-h h2{position:relative;display:inline-block}
.sec-h h2::after{content:"";display:block;height:8px;margin-top:2px;border-radius:8px;width:70%;background:var(--accent);opacity:.8;transform-origin:left;animation:grow .8s .3s backwards}
@keyframes grow{from{transform:scaleX(0)}}

.age{animation:popIn .55s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--i)*70ms + .2s);box-shadow:0 6px 0 rgba(39,35,77,.10)}
.age:hover{transform:translateY(-6px) rotate(-1.5deg)}
.age:active{transform:scale(.96)}
.age .shape{animation:spin 18s linear infinite}
.age:hover .shape{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.88)}}

.grid.pop .card{animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*55ms)}
.card{transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:0 14px 34px rgba(39,35,77,.16);border-color:var(--ink)}
.ph img{transition:transform .5s}
.card:hover .ph img{transform:scale(1.08)}
.ph svg.gl{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.tag{animation:tagpop 2.6s ease-in-out infinite}
@keyframes tagpop{0%,86%,100%{transform:scale(1)}92%{transform:scale(1.14) rotate(-4deg)}}
.chip,.btn,.pill{transition:transform .15s,background .2s,border-color .2s,filter .2s}
.chip:hover{transform:translateY(-2px)}
.chip:active,.btn:active,.pill:active{transform:scale(.94)}
.btn.add:hover{animation:wiggle .5s}
.pulse{animation:pulse .35s}
@keyframes pulse{40%{transform:scale(1.07)}}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5)}60%{transform:scale(.9)}}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}

#ov{animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.panel{animation:slideUp .38s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}}
@keyframes slideLeft{from{transform:translateX(60px);opacity:0}}
@keyframes popC{from{opacity:0;transform:translate(-50%,-47%) scale(.95)}}
@media(min-width:760px){
  .panel.cart,.panel.checkout,.panel.done{animation-name:slideLeft}
  .panel.detail,.panel.edit{animation-name:popC}}
.done .big{animation:popIn .6s .15s cubic-bezier(.2,.9,.3,1.5) backwards}
.done .big path{stroke-dasharray:30;stroke-dashoffset:0;animation:draw .6s .5s ease-out backwards}
@keyframes draw{from{stroke-dashoffset:30}}
.cfbox{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.cfbox i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

@media(max-width:480px){.hdr{gap:6px}.pill{padding:7px 11px;font-size:13px}.logo{font-size:24px}.logo svg{width:30px;height:30px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .hl{background-size:100% 100%}
  .reveal{opacity:1;transform:none}}

/* ---------- image ---------- */
function resize(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};im.onerror=()=>rej(new Error('img'));im.src=u})}
const blobData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function pickImage(file){
  const t=$('#droptxt');if(t){t.hidden=false;t.innerHTML=L('ছবি প্রস্তুত হচ্ছে…','Preparing photo…')}
  try{
    if(S.assets){const b=await resize(file,1000,.82);const r=await S.assets.upload(b);S.editImg=r.url}
    else{const b=await resize(file,640,.7);S.editImg=await blobData(b)}
    drawDrop()}catch(e){toast(L('ছবি যোগ করা যায়নি, অন্য ছবি দিয়ে চেষ্টা করুন','Could not add the photo. Try another one.'));drawDrop()}}

const A={
  shop(){closePanel();show('shop')},
  scrollp(){$('#agehead').scrollIntoView({behavior:'smooth',block:'start'})},
  admin(){show('admin')},
  close(){closePanel()},
  lang(){LANG=LANG==='en'?'bn':'en';LS.set('kd_lang2',LANG);renderAll()},
  age(t){S.age=t.dataset.v;renderAges();renderGrid();if(t.classList.contains('age'))$('#products').scrollIntoView({behavior:'smooth',block:'start'})},
  cat(t){S.cat=t.dataset.v;renderCats();renderGrid()},
  add(t){setQty(t.dataset.id,(S.cart[t.dataset.id]||0)+1)},
  dec(t){setQty(t.dataset.id,(S.cart[t.dataset.id]||0)-1)},
  rm(t){setQty(t.dataset.id,0)},
  cart(){openPanel('cart')},
  checkout(){if(cartLines().length)openPanel('checkout')},

  star(t){S.star=+t.dataset.v;drawStars()},
  tab(t){S.tab=t.dataset.v;renderAdmin()},

  delo(t){twice(t,()=>delOrder(t.dataset.id).catch(FAIL))},
  delr(t){twice(t,()=>del('reviews',t.dataset.id).catch(FAIL))},
  delq(t){twice(t,()=>del('qna',t.dataset.id).catch(FAIL))},
  async ansq(t){const id=t.dataset.id,x=S.qna.find(q=>q.id===id);if(!x)return;const k=CSS.escape(id),a=$('#ans-'+k).value.trim(),aEn=$('#ansen-'+k).value.trim();
    try{await put('qna',id,{q:x.q||'',qEn:x.qEn||'',name:x.name||'',ts:x.ts||Date.now(),a,aEn});toast(a||aEn?L('উত্তর প্রকাশ হয়েছে','Answer published'):L('উত্তর সরানো হয়েছে','Answer removed'))}catch(e){FAIL()}}
};
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closePanel();return}
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.panel)closePanel()});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='sort'){S.sort=t.value;renderGrid()}
  else if(t.id==='imgin'&&t.files[0])pickImage(t.files[0]);
  else if(t.name==='area'&&$('#cksum'))$('#cksum').innerHTML=sumHTML(t.value);
  else if(t.dataset.act==='ostatus'){const o=S.orders.find(x=>x.id===t.dataset.id);if(!o)return;try{await setOrderStatus(o,t.value);toast(L('অবস্থা বদলানো হয়েছে','Status updated'))}catch(err){FAIL()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderGrid()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;if(!k)return;
  const fd=new FormData(f),btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{
    if(k==='order'){
      const phone=toEn(fd.get('phone')).replace(/[\s-]/g,'');
      if(!/^(\+?88)?01[3-9]\d{8}$/.test(phone)){const er=$('#orderr');er.textContent=L('সঠিক মোবাইল নম্বর দিন, যেমন ০১৭১২৩৪৫৬৭৮','Enter a valid mobile number, e.g. 01712345678');er.hidden=false;return}
      const L2=cartLines(),area=fd.get('area'),t=totals(area);if(!L2.length)return;
      const id='KD'+Date.now().toString(36).toUpperCase().slice(-6);
      try{await saveOrder(id,{ts:Date.now(),name:fd.get('name').trim(),phone,addr:fd.get('addr').trim(),area,note:fd.get('note').trim(),items:L2.map(({p,q})=>({id:p.id,name:pName(p),price:p.price,qty:q})),subtotal:t.sub,delivery:t.del,total:t.total,pay:'cod',status:'new'})}
      catch(err){const er=$('#orderr');er.textContent=L('অর্ডার জমা হয়নি। কিছুক্ষণ পরে আবার চেষ্টা করুন।','Your order was not submitted. Please try again in a moment.');er.hidden=false;return}
      S.cart={};LS.set('kd_cart',S.cart);badge();openPanel('done',{id,total:t.total,phone});confetti();
    }else if(k==='review'){
      await put('reviews','r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{pid:f.dataset.pid,name:fd.get('name').trim(),rating:S.star,text:fd.get('text').trim(),ts:Date.now()});
      f.reset();toast(L('রিভিউ দেওয়ার জন্য ধন্যবাদ','Thanks for your review'));
    }else if(k==='ask'){
      await put('qna','q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{q:fd.get('q').trim(),name:fd.get('name').trim(),a:'',ts:Date.now()});
      f.reset();toast(L('প্রশ্ন জমা হয়েছে। উত্তর দিলে এখানে দেখাবে।','Question sent. It will appear here once answered.'));
    }else if(k==='faq'){
      const q=fd.get('q').trim(),qEn=fd.get('qEn').trim(),a=fd.get('a').trim(),aEn=fd.get('aEn').trim();
      if(!(q||qEn)||!(a||aEn)){const er=$('#faqerr');er.textContent=L('অন্তত এক ভাষায় প্রশ্ন ও উত্তর লিখুন','Write the question and answer in at least one language');er.hidden=false;return}
      await put('qna','q'+Date.now().toString(36),{q,qEn,name:'',a,aEn,ts:Date.now()});f.reset();toast(L('যোগ হয়েছে','Added'));
    }else if(k==='settings'){
      await put('settings','main',{announce:fd.get('announce').trim(),announceEn:fd.get('announceEn').trim(),dhaka:+fd.get('dhaka'),outside:+fd.get('outside'),freeOver:+fd.get('freeOver'),phone:fd.get('phone').trim()});toast(L('সেটিংস সংরক্ষণ হয়েছে','Settings saved'));
    }else if(k==='product'){
      const ages=fd.getAll('ages'),name=fd.get('name').trim(),nameEn=fd.get('nameEn').trim(),er=$('#perr');
      if(!name&&!nameEn){er.textContent=L('অন্তত এক ভাষায় পণ্যের নাম দিন','Enter the product name in at least one language');er.hidden=false;return}
      if(!ages.length){er.textContent=L('অন্তত একটি বয়সের গ্রুপ বেছে নিন','Pick at least one age group');er.hidden=false;return}
      const id=f.dataset.id||('p'+Date.now().toString(36)),old=S.products.find(x=>x.id===f.dataset.id);
      await put('products',id,{name,nameEn,price:+fd.get('price'),old:+fd.get('old')||0,cat:fd.get('cat'),ages,stock:+fd.get('stock'),desc:fd.get('desc').trim(),descEn:fd.get('descEn').trim(),img:S.editImg,ts:old?.ts||Date.now()});
      closePanel();toast(L('পণ্য সংরক্ষণ হয়েছে','Product saved'));
    }
  }catch(err){toast(L('সংরক্ষণ করা যায়নি। অনুমতি বা নেটওয়ার্ক পরীক্ষা করুন।','Could not save. Check permission or network.'))}
  finally{if(btn&&btn.isConnected)btn.disabled=false}});

(function(){
  const C=['#FF8FB1','#FFC93C','#6FD6B4','#8EB8FF','#B79CFF','#FFA566'];
  const SH={
    star:'<path d="M50 8 L61 38 L93 38 L67 57 L77 90 L50 70 L23 90 L33 57 L7 38 L39 38Z" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>',
    ring:'<circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="14"/>',

    wave:'<path d="M8 50 q10-30 21 0 t21 0 t21 0 t21 0" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>',
    plus:'<path d="M50 16v68M16 50h68" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>',
    dot:'<circle cx="50" cy="50" r="40" fill="currentColor"/>'};
  const L0=[['star',4,10,38],['ring',90,6,44],['tri',14,32,30],['wave',80,24,64],['plus',94,46,28],['dot',6,56,22],['star',88,68,34],['ring',10,80,40],['tri',72,88,32],['wave',32,92,58],['plus',50,5,26],['dot',60,58,18],['star',42,48,22],['dot',24,16,16]];
  const box=document.getElementById('bgfx');if(!box)return;
  L0.forEach((d,i)=>{const e=document.createElement('i');e.className='fx';
    e.style.cssText=`left:${d[1]}%;top:${d[2]}%;width:${d[3]}px;height:${d[3]}px;color:${C[i%6]};--dur:${(7+(i*1.7)%6).toFixed(1)}s;--dl:-${(i*1.3).toFixed(1)}s;--rot:${i%2?'':'-'}${16+i*3}deg`;
    e.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%">${SH[d[0]]}</svg>`;box.appendChild(e)});
})();
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#FF8FB1','#FFC93C','#6FD6B4','#8EB8FF','#B79CFF','#FFA566'],box=document.createElement('div');
  box.className='cfbox';box.setAttribute('aria-hidden','true');
  for(let i=0;i<54;i++){const e=document.createElement('i');
    e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%6]};--dx:${(Math.random()*180-90)|0}px;--r:${(Math.random()*720-360)|0}deg;animation-delay:${(Math.random()*.5).toFixed(2)}s;animation-duration:${(1.9+Math.random()*1.5).toFixed(2)}s;${i%3?'':'border-radius:50%'}`;box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4200)}
(function(){const els=$$('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.06});
  els.forEach(e=>io.observe(e))})();

/* ---------- boot ---------- */
const use=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};
renderAll();
(async()=>{
  const [db,user,assets]=await Promise.all([use('db'),use('user'),use('assets')]);
  if(db){
    S.db=db;S.assets=assets;
    try{S.isAdmin=!!(user&&await user.canEdit());S.uid=user?await user.id():null}catch(e){}
    db.doc('settings/main').onSnapshot(s=>{S.settings={...DEF,...(s.exists?s.data():{})};rerender()},()=>{});
    ['products','reviews','qna'].forEach(sub);
    if(S.isAdmin)subOrders();
  }else{
    S.products=LS.get('kd_products',null)||SAMPLE;S.qna=LS.get('kd_qna',null)||FAQ;S.reviews=LS.get('kd_reviews',[]);S.orders=LS.get('kd_orders',[]);
    S.settings={...DEF,...LS.get('kd_settings',{})};S.isAdmin=true;S.loaded=true;
    Object.keys(S.cart).forEach(id=>{if(!S.products.find(p=>p.id===id))delete S.cart[id]});
  }
  renderAll();
})();
